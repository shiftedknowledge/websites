<!-- Moment Hill — email header.
     A text wordmark, not the logo image: the logo lives in the site's build
     output, momenthill.com is not serving yet (DNS/M365 migration pending), and
     a hotlinked image that 404s looks worse than type that always renders.
     Swap in an <img> once the domain is live, if it earns its place.

     Styles are inline as well as classed. Gmail and Outlook strip or ignore
     <style> blocks often enough that the class alone cannot be trusted. -->
<div class="mh-header" style="padding-bottom:1.2em;margin-bottom:2em;border-bottom:1px solid #9baca4;">
  <span class="mh-wordmark" style="font-family:Georgia,'Times New Roman',serif;font-size:21px;color:#425e4f;letter-spacing:0.01em;">Moment Hill</span>
</div>
