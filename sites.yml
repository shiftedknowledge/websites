# Deployment manifest — the desired Cloudflare state for every site, in git.
#
# This is the readable source of truth. Cloudflare's dashboard is where a build
# actually runs, and its per-project settings must match what is recorded here.
# Nothing reads this file automatically today; it exists so the configuration is
# not trapped only in the dashboard. When you change a project's settings, update
# this file in the same commit.

sites:
  shifted-knowledge:
    content_repo: shiftedknowledge/shifted-knowledge-content
    cloudflare_project: shifted-knowledge
    production_branch: main
    output_dir: .infra/sites/shifted-knowledge/dist
    schema: 3            # must equal sites/shifted-knowledge/CONTENT_SCHEMA
                         # 2 -> 3 on 2026-07-28: markdown-only, symlinks rejected.
    domain: shiftedknowledge.com          # apex + www are attached to the Pages project
    mail: fastmail                        # see docs/dns.md
    infra_ref: main      # production. NOTE: the *preview* env is still pinned to SHA
                         # 74d8fb08d7c59b4297e50727d56429484c182ebd. Harmless while no
                         # preview branches are in use; fix if that changes.

  moment-hill:
    content_repo: shiftedknowledge/moment-hill-content
    cloudflare_project: moment-hill           # serves moment-hill.pages.dev; git-connected 2026-07-27
    deploy: git                               # a push to the content repo builds and deploys, as with shifted-knowledge
    legacy_project: moment-hill-preview       # superseded direct-upload project. The domain is live,
                                              # nothing links to it: safe to delete.
    production_branch: main
    output_dir: .infra/sites/moment-hill/dist
    schema: 2            # must equal sites/moment-hill/CONTENT_SCHEMA
                         # 1 -> 2 on 2026-07-28: markdown-only, symlinks rejected.
    node_version: 22     # Cloudflare NODE_VERSION (Option A: npm, Node 22)
    domain: momenthill.com                # apex + www both attached 2026-07-27. Nameservers moved
                                          # Hover -> Cloudflare (alex/donna.ns.cloudflare.com);
                                          # registration stays at Hover. See docs/dns.md.
    mail: microsoft-365                   # load-bearing. Read docs/dns.md before any zone edit.
    newsletter: buttondown                # see docs/newsletter.md
    infra_ref: main      # production and preview both track main
