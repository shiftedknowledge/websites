# Deployment manifest — the desired Cloudflare state for every site, in git.
#
# This is the readable source of truth. Cloudflare's dashboard is where a build
# actually runs, and its per-project settings must match what is recorded here.
# Nothing reads this file automatically today; it exists so the configuration is
# not trapped only in the dashboard. When you change a project's settings, update
# this file in the same commit.

sites:
  shifted-knowledge:
    content_repo: shiftedknowledge/shifted-knowledge-content
    cloudflare_project: shifted-knowledge
    production_branch: main
    output_dir: .infra/sites/shifted-knowledge/dist
    schema: 1            # must equal sites/shifted-knowledge/CONTENT_SCHEMA
    domain: shiftedknowledge.com          # custom domain (apex + www) attached 2026-07-23; pages.dev still serves as origin
    infra_ref: main      # Cloudflare INFRA_REF tracks main (active dev); pin a SHA to freeze

  moment-hill:
    content_repo: shiftedknowledge/moment-hill-content
    cloudflare_project: moment-hill
    production_branch: main
    output_dir: .infra/sites/moment-hill/dist
    schema: 1            # must equal sites/moment-hill/CONTENT_SCHEMA
    node_version: 22     # Cloudflare NODE_VERSION (Option A: npm, Node 22)
    domain: momenthill.com                # custom domain (apex + www) — NOT yet attached; DNS/M365 migration pending
    infra_ref: main      # Cloudflare INFRA_REF tracks main (active dev); pin a SHA to freeze
